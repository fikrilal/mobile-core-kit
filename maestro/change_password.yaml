# Register → Profile → Security → Change password.
# MAESTRO_TEST_PASSWORD = current. MAESTRO_TEST_NEW_PASSWORD = new (min 10).
# Unique email. Do not curl-register.
# See maestro/README.md.
appId: dev.fikril.mobile.corekit.dev
---
- launchApp:
    clearState: true
- runFlow: _register_to_home.yaml
- tapOn: "(?s).*Profile.*"
- tapOn: "(?s).*Security and privacy.*"
- tapOn: "(?s).*Change password.*"
- extendedWaitUntil:
    visible: "Update password"
    timeout: 10000
- tapOn:
    below:
      text: "^Current password$"
    above:
      text: "^New password$"
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn:
    text: "Change password"
    index: 0
- tapOn:
    below:
      text: "^New password$"
    above:
      text: "^Confirm new password$"
- inputText: ${MAESTRO_TEST_NEW_PASSWORD}
- tapOn:
    text: "Change password"
    index: 0
- tapOn:
    below:
      text: "^Confirm new password$"
    above:
      text: "Update password"
- inputText: ${MAESTRO_TEST_NEW_PASSWORD}
- tapOn:
    text: "Change password"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Update password"
      enabled: true
    timeout: 10000
- tapOn:
    text: "Update password"
    enabled: true
- extendedWaitUntil:
    visible: "Password updated"
    timeout: 20000
