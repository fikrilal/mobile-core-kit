# Cold start: onboarding → sign-in → profile gate → home.
# Fresh password users have empty givenName, so appRedirect sends
# /user/complete-profile before /home.
# Labels are non-clickable Views; tap the EditText below the label.
# text selectors are regex: below: "Password" also matches
# "Forgot password?" and taps the disabled Sign In control.
# Password EditText is the parent of "Show password".
# Dismiss IME via the app-bar title. Never hideKeyboard (BACK).
appId: dev.fikril.mobile.corekit.dev
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Continue onboarding"
    commands:
      - tapOn: "Continue onboarding"
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 20000
- tapOn:
    below:
      text: '^Email$'
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    text: "Sign In"
    index: 0
- tapOn:
    containsChild:
      text: "Show password"
- tapOn: "Show password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn:
    text: "Sign In"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Sign in to your account"
      enabled: true
    timeout: 10000
- tapOn:
    text: "Sign in to your account"
    enabled: true
- extendedWaitUntil:
    visible: "Complete your profile"
    timeout: 30000
- tapOn:
    below:
      text: '^First Name$'
- inputText: "Pilot"
- tapOn: "Complete your profile"
- tapOn:
    below:
      text: '^Last Name$'
- inputText: "User"
- tapOn: "Complete your profile"
- tapOn:
    text: "Continue"
    enabled: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
