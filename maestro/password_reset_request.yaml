# Sign In → Forgot password → send reset link.
# Success copy is shown even when the email has no account.
# Unique MAESTRO_TEST_EMAIL. Do not curl-register.
# See maestro/README.md.
appId: dev.fikril.mobile.corekit.dev
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Continue onboarding"
    commands:
      - tapOn: "Continue onboarding"
- extendedWaitUntil:
    visible: "Sign in to your account"
    timeout: 20000
- tapOn: "Forgot password\\?"
- extendedWaitUntil:
    visible: "Send reset link"
    timeout: 10000
- tapOn:
    below:
      text: '^Email$'
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    text: "Reset password"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Send reset link"
      enabled: true
    timeout: 10000
- tapOn:
    text: "Send reset link"
    enabled: true
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 20000
