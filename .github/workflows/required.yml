name: Mobile Required Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: required-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  risk:
    name: CI Risk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      effective_risk: ${{ steps.classify.outputs.effective_risk }}
      runtime_required: ${{ steps.classify.outputs.runtime_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap pinned Flutter and Dart
        uses: ./.github/actions/flutter-bootstrap
        with:
          install-dependencies: "true"
          validate-env-schema: "false"
          generate-build-config: "false"

      - name: Classify clean base and head revisions
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40,64}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse "$HEAD_SHA^")
          fi
          dart run mobile_core_kit_cli:mobilekit ci classify \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  full:
    name: CI Full
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare non-secret environments
        run: |
          cp .env/dev.example.yaml .env/dev.yaml
          cp .env/staging.example.yaml .env/staging.yaml
          cp .env/prod.example.yaml .env/prod.yaml

      - name: Bootstrap pinned Flutter and generated config
        uses: ./.github/actions/flutter-bootstrap
        with:
          env: dev
          install-dependencies: "true"
          validate-env-schema: "true"
          strict-env-schema: "false"

      - name: Run canonical clean-checkout verification
        run: dart run mobile_core_kit_cli:mobilekit verify --profile ci --env dev

  coverage:
    name: CI Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COVERAGE_MIN: "55.0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare dev env config
        run: |
          mkdir -p .env
          if [[ -n "${ENV_DEV_YAML:-}" ]]; then
            printf '%s\n' "$ENV_DEV_YAML" > .env/dev.yaml
            echo "Resolved .env/dev.yaml from secret."
          elif [[ -f .env/dev.example.yaml ]]; then
            cp .env/dev.example.yaml .env/dev.yaml
            echo "Resolved .env/dev.yaml from .env/dev.example.yaml."
          else
            echo "::error::.env/dev.yaml is missing and .env/dev.example.yaml was not found."
            exit 1
          fi
          if [[ ! -s .env/dev.yaml ]]; then
            echo "::error::.env/dev.yaml is empty after preparation."
            exit 1
          fi
        env:
          ENV_DEV_YAML: ${{ secrets.ENV_DEV_YAML }}

      - name: Bootstrap Flutter + generated config
        uses: ./.github/actions/flutter-bootstrap
        with:
          env: dev
          validate-env-schema: "true"
          strict-env-schema: "false"
          install-dependencies: "true"

      - name: Test with coverage (exclude goldens)
        run: |
          mapfile -t non_golden_tests < <(
            find test -type f -name '*_test.dart' ! -path '*/goldens/*' | sort
          )
          if [[ "${#non_golden_tests[@]}" -eq 0 ]]; then
            echo "::error::No non-golden test files discovered."
            exit 1
          fi
          flutter test --coverage "${non_golden_tests[@]}"

      - name: Enforce line coverage floor
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          lcov = Path('coverage/lcov.info')
          if not lcov.exists():
            raise SystemExit('coverage/lcov.info not found')

          found = 0
          hit = 0
          for line in lcov.read_text(encoding='utf-8').splitlines():
            if not line.startswith('DA:'):
              continue
            found += 1
            _, payload = line.split(':', 1)
            _, hits = payload.split(',', 1)
            if int(hits) > 0:
              hit += 1

          if found == 0:
            raise SystemExit('No executable lines found in lcov report')

          coverage = (hit / found) * 100.0
          threshold = float(os.environ.get('COVERAGE_MIN', '0'))
          print(f'Line coverage: {coverage:.2f}% (threshold: {threshold:.2f}%)')
          if coverage < threshold:
            raise SystemExit(
              f'Coverage gate failed: {coverage:.2f}% < {threshold:.2f}%'
            )
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

  runtime:
    name: CI Runtime
    needs: risk
    if: needs.risk.outputs.runtime_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare non-secret dev environment
        run: cp .env/dev.example.yaml .env/dev.yaml

      - name: Prepare CI-only Firebase build fixture
        run: cp harness/fixtures/google-services.ci.json android/app/google-services.json

      - name: Bootstrap pinned Flutter and generated config
        uses: ./.github/actions/flutter-bootstrap
        with:
          env: dev
          install-dependencies: "true"
          validate-env-schema: "true"
          strict-env-schema: "false"

      - name: Run portable golden evidence
        run: |
          mapfile -t golden_targets < <(dart run mobile_core_kit_cli:mobilekit oracle paths --kind golden-test)
          flutter test "${golden_targets[@]}" --reporter expanded

      - name: Prove Android debug assembly
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart --dart-define=ENV=dev

      - name: Enable emulator acceleration
        run: |
          sudo -n true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute registered integration oracles on Android
        uses: reactivecircus/android-emulator-runner@69c8581131285561115a2e413eb0037446bdc2d6 # v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mapfile -t integration_targets < <(dart run mobile_core_kit_cli:mobilekit oracle paths --kind integration-test)
            for target in "${integration_targets[@]}"; do
              flutter test "$target" -d emulator-5554 --flavor dev --dart-define=ENV=dev
            done

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-golden-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  governance:
    name: CI Governance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required:
    name: CI Required
    needs:
      - risk
      - full
      - coverage
      - runtime
      - governance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RISK_RESULT: ${{ needs.risk.result }}
      FULL_RESULT: ${{ needs.full.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      RUNTIME_REQUIRED: ${{ needs.risk.outputs.runtime_required }}
      RUNTIME_RESULT: ${{ needs.runtime.result }}
      GOVERNANCE_RESULT: ${{ needs.governance.result }}
    steps:
      - name: Require every selected lane
        run: |
          if [[ "$RISK_RESULT" != "success" || \
                "$FULL_RESULT" != "success" || \
                "$COVERAGE_RESULT" != "success" || \
                "$GOVERNANCE_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$RUNTIME_REQUIRED" == "true" && "$RUNTIME_RESULT" != "success" ]] || \
             [[ "$RUNTIME_REQUIRED" != "true" && "$RUNTIME_RESULT" != "skipped" && "$RUNTIME_RESULT" != "success" ]]; then
            exit 1
          fi
