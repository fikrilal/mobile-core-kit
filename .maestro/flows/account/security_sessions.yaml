# mobtrace:
#   area: account
#   owns:
#     - lib/features/account/subfeatures/security/
#     - lib/features/account/presentation/
#     - lib/navigation/account/
appId: ${APP_ID}
name: Security and active sessions
tags:
  - requires_backend
---
- runFlow:
    file: ../../subflows/launch_clean.yaml
- runFlow:
    file: ../../subflows/complete_onboarding.yaml
- tapOn:
    text: Email
    index: 1
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    text: Password
    index: 1
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn:
    id: auth_sign_in_submit
- assertVisible: Home
- tapOn: "Profile\nTab 2 of 2"
- scrollUntilVisible:
    element:
      text: "(?s)Security and privacy.*"
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    text: "(?s)Security and privacy.*"
- assertVisible: Manage your password, active sessions, and account deletion settings.
- tapOn:
    text: "(?s)Active sessions.*"
- assertVisible: Check where your account is signed in and revoke access you no longer trust.
- assertVisible:
    text: "(?s).*This device.*"
- pressKey: BACK
- assertVisible: Manage your password, active sessions, and account deletion settings.
- takeScreenshot: security_sessions_complete
