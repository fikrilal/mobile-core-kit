# mobtrace:
#   area: account
#   owns:
#     - lib/features/account/subfeatures/profile/
#     - lib/core/runtime/user_context/
#     - lib/navigation/account/
appId: ${APP_ID}
name: Profile update with backend cleanup
tags:
  - requires_backend
  - destructive
---
- runFlow:
    file: ../../subflows/launch_clean.yaml
- runFlow:
    file: ../../subflows/complete_onboarding.yaml
- tapOn:
    text: Email
    index: 1
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    text: Password
    index: 1
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn:
    id: auth_sign_in_submit
- assertVisible: Home
- tapOn: "Profile\nTab 2 of 2"
- scrollUntilVisible:
    element:
      id: profile_edit_open
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: profile_edit_open
- assertVisible: Save changes
- tapOn:
    id: profile_given_name
- eraseText
- inputText: Runtime
- assertVisible: Runtime
- tapOn: Save changes
- tapOn:
    text: Save changes
    optional: true
- assertNotVisible: Save changes
- assertVisible: Runtime Fixture
- tapOn: "Home\nTab 1 of 2"
- tapOn: "Profile\nTab 2 of 2"
- assertVisible: Runtime Fixture
- takeScreenshot: profile_update_complete
