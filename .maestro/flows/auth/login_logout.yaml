appId: ${APP_ID}
name: Login and logout with run-scoped identity
tags:
  - requires_backend
---
- runFlow:
    file: ../../subflows/launch_clean.yaml
- runFlow:
    file: ../../subflows/complete_onboarding.yaml
- tapOn:
    text: Email
    index: 1
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    text: Password
    index: 1
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn:
    id: auth_sign_in_submit
- assertVisible: Home
- tapOn: "Profile\nTab 2 of 2"
- scrollUntilVisible:
    element:
      text: "(?s)Log out.*"
    direction: DOWN
    visibilityPercentage: 50
- assertVisible:
    text: "(?s)Log out.*"
- tapOn:
    text: "(?s)Log out.*"
- assertVisible: Log out?
- tapOn: Log out
- assertVisible:
    id: auth_sign_in_submit
- assertNotVisible: Profile
- takeScreenshot: login_logout_complete
